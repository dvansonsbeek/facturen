name: Controle

# Pushes naar main worden al gecontroleerd door de publicatie-workflow, die
# niets publiceert als de tests rood staan. Deze draait op pull requests, zodat
# een voorstel ook getoetst wordt vóórdat het op main komt.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  controleren:
    # Vastgezet op 24.04. Op 19 oktober 2026 verschuift ubuntu-latest naar
    # Ubuntu 26, en `playwright install --with-deps` installeert apt-pakketten
    # uit een lijst die Playwright per Ubuntu-versie bijhoudt. Loopt die achter
    # op het image, dan valt die stap om — en in pages.yml houdt dat de
    # publicatie tegen.
    #
    # Verhuizen doen we zelf, en deze workflow is de proef: zet hem in een pull
    # request op ubuntu-26.04 en laat hem draaien. Hij doet alles wat eraan
    # hangt — Playwright met zijn systeempakketten, de JRE, de Schematron, de
    # publicatiebuild en beide UAT-reizen. Groen betekent dat pages.yml mee kan;
    # rood kost niets, want main staat dan nog op 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Voor de officiële SI-UBL-validator; zie scripts/controleer-efactuur.mjs.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: .validatie-cache
          key: validatie-saxon10.9-siubl2026-05-21

      - name: Typecontrole
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - run: npx playwright install --with-deps chromium
      - name: Tests
        run: npm test

      # Ook de publicatiebuild, want die faalt op dingen die `next dev` niet
      # laat zien: een statische export is een ander pad dan de dev-server.
      - name: Publicatiebuild
        run: npm run build
        env:
          PAGES_BASE_PATH: /facturen

      - name: Controle op de gepubliceerde build
        run: npm run check:publicatie
        env:
          PAGES_BASE_PATH: /facturen

      - name: UAT-reis op de publicatiebuild
        run: npm run test:uat
        env:
          PAGES_BASE_PATH: /facturen

      - name: E-factuur tegen SI-UBL 2.0
        run: npm run check:efactuur
        env:
          PAGES_BASE_PATH: /facturen
