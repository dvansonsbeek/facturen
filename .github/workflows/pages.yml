name: Publiceren naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén publicatie tegelijk, en een lopende niet afbreken: half gepubliceerd is
# erger dan even wachten.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouwen:
    # Vastgezet op 24.04, net als de andere twee taken hieronder; zie het
    # commentaar bovenaan ci.yml voor het waarom en voor hoe we verhuizen.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Voor de officiële SI-UBL-validator: dat is een XSLT 2.0-stylesheet en
      # die heeft Saxon nodig. Alleen hier, nooit in de app zelf.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Saxon en de validator zijn samen zes megabyte en staan niet in de repo.
      # Gecachet op hun vaste versie, zodat ze één keer binnenkomen en een
      # haperende download hierna niet de publicatie ophoudt.
      - uses: actions/cache@v4
        with:
          path: .validatie-cache
          key: validatie-saxon10.9-siubl2026-05-21

      # De tests draaien tegen de echte app en zijn de reden dat deze fork
      # durfde te veranderen wat hij veranderd heeft; een rode suite hoort
      # niet gepubliceerd te worden.
      - run: npx playwright install --with-deps chromium
      - run: npm test

      # Geen PAGES_BASE_PATH meer: sinds factuurr.nl een eigen domein is, staat
      # de app op de root en niet onder /facturen. next.config.ts laat basePath
      # en assetPrefix dan vanzelf weg — daar was die variabele voor bedoeld.
      #
      # De bezoekersteller zit hier wél, en alleen hier: zonder die variabele
      # bouwt de app geen telpixel en blijft het beveiligingsbeleid onveranderd
      # (zie lib/analytics.ts).
      - run: npm run build
        env:
          NEXT_PUBLIC_GOATCOUNTER: ${{ vars.GOATCOUNTER_CODE }}
          # De naam van de Buy Me a Coffee-pagina, zonder buymeacoffee.com ervoor.
          # Niet gezet is geen verwijzing; er wordt nergens een knopscript van
          # buiten geladen, om dezelfde reden als bij de teller (zie
          # lib/analytics.ts).
          NEXT_PUBLIC_KOFFIE: ${{ vars.KOFFIE_NAAM }}

      # De gepubliceerde versie draait onder een strenger beveiligingsbeleid dan
      # de ontwikkelserver, dus een fout daarin merk je niet in de testsuite.
      # Deze controle opent de echte build en kijkt of de PDF het nog doet en er
      # niets naar buiten gaat.
      - run: npm run check:publicatie

      # De hele reis door de app, tegen de build die hierna gepubliceerd wordt:
      # twee klanten factureren, er een weggooien, een offerte omzetten, alles
      # versleutelen en opruimen. Vindt wat alleen in de volgorde zit.
      - name: UAT-reis op de publicatiebuild
        run: npm run test:uat

      # De e-factuur door de Schematron van de Nederlandse Peppolautoriteit.
      # Onafhankelijk van onze eigen tests: die zijn door dezelfde hand
      # geschreven als lib/ubl.ts en kunnen alleen bevestigen wat daar al stond.
      - name: E-factuur tegen SI-UBL 2.0
        run: npm run check:efactuur

      # _next begint met een liggend streepje en zou door Jekyll worden
      # overgeslagen. Deze actie draait geen Jekyll, maar het kost niets.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publiceren:
    needs: bouwen
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Dezelfde reis nog één keer, nu tegen de site zoals hij er echt staat. De
  # stap hierboven toetst de build; deze toetst de publicatie — een verkeerd
  # voorvoegsel, een ontbrekende .nojekyll of een asset die Pages niet uitlevert
  # zie je alleen hier. Kan geen kwaad: er is geen server en geen account, dus
  # alles wat de reis aanmaakt staat in de browser van de test.
  uat-op-de-site:
    needs: publiceren
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Wachten tot de nieuwe versie wordt uitgeleverd
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            [ "$code" = "200" ] && echo "bereikbaar na ${i}e poging" && exit 0
            sleep 10
          done
          echo "$URL gaf na vijf minuten geen 200"; exit 1
        env:
          URL: https://factuurr.nl/

      - name: UAT-reis op de gepubliceerde site
        run: npm run test:uat
        env:
          UAT_BASE_URL: https://factuurr.nl/
